<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Concierge · Simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
<link rel="stylesheet" href="/app.css">
<style>
  .chat-shell { max-width: 640px; margin: 20px auto; padding: 0 14px; }
  .chat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; height: calc(100dvh - 150px); min-height: 420px;
  }
  .chat-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .avatar { width: 34px; height: 34px; border-radius: 99px; background: var(--accent);
            color: var(--accent-text); display: grid; place-items: center; font-weight: 700; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 14px;
    font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .bubble.out { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 5px; }
  .bubble.in  { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .meta { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .bubble.out + .meta { align-self: flex-end; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .composer input { flex: 1; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; }
  .typing span { width: 6px; height: 6px; border-radius: 99px; background: var(--text-dim); animation: bounce 1.1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { opacity:.3; transform: translateY(0); } 30% { opacity:1; transform: translateY(-3px); } }
  .suggestions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px; }
  .suggestions button { font-size: 12.5px; padding: 5px 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="mark" aria-hidden="true">V</div>
  <h1>Simulator</h1>
  <div class="spacer"></div>
  <a class="btn" href="/dashboard" style="text-decoration:none">Dashboard</a>
</div>

<div class="chat-shell">
  <div class="small muted" style="margin-bottom:10px">
    Talks to the real pipeline — same allowlist, same model, same calendar. Twilio is
    the only part not involved.
  </div>

  <div class="chat">
    <div class="chat-head">
      <div class="avatar" aria-hidden="true">V</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:14.5px">Villa Meltem Concierge</div>
        <div class="small muted" id="who">…</div>
      </div>
      <select id="guest" aria-label="Send as" style="width:auto;max-width:190px"></select>
    </div>

    <div class="log" id="log" role="log" aria-live="polite"></div>

    <div class="suggestions" id="suggestions">
      <button data-q="What's the wifi password?">wifi password</button>
      <button data-q="What time is the boat today?">boat time</button>
      <button data-q="What's happening tomorrow?">tomorrow</button>
      <button data-q="Where do we eat tonight and what's the dress code?">dinner &amp; dress code</button>
    </div>

    <form class="composer" id="composer">
      <input id="input" placeholder="Ask about the villa…" autocomplete="off" required>
      <button class="primary" type="submit" id="send">Send</button>
    </form>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

let phone = localStorage.getItem("concierge.sim.phone") || "";

function bubble(text, side, meta) {
  const el = document.createElement("div");
  el.className = `bubble ${side}`;
  el.textContent = text;
  $("log").append(el);

  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    $("log").append(m);
  }
  $("log").scrollTop = $("log").scrollHeight;
}

function typing(on) {
  document.querySelector(".typing")?.remove();
  if (!on) return;
  const el = document.createElement("div");
  el.className = "typing";
  el.innerHTML = "<span></span><span></span><span></span>";
  $("log").append(el);
  $("log").scrollTop = $("log").scrollHeight;
}

async function loadGuests() {
  const guests = await fetch("/simulator/guests").then((r) => r.json());
  if (!Array.isArray(guests) || guests.length === 0) {
    $("who").textContent = "no guests — run npm run seed";
    $("send").disabled = true;
    return;
  }

  phone = guests.some((g) => g.phone === phone) ? phone : guests[0].phone;
  $("guest").innerHTML = guests
    .map((g) => `<option value="${esc(g.phone)}"${g.phone === phone ? " selected" : ""}>${esc(g.name)}</option>`)
    .join("");
  $("who").textContent = "online";
  await loadHistory();
}

async function loadHistory() {
  localStorage.setItem("concierge.sim.phone", phone);
  $("log").innerHTML = "";
  const data = await fetch(`/simulator/history?from=${encodeURIComponent(phone)}`).then((r) => r.json());

  if (!data.messages?.length) {
    bubble("Hello! Ask me anything about the villa — the wifi, the schedule, dinner, getting around.", "in");
    return;
  }
  for (const m of data.messages) bubble(m.body, m.direction === "inbound" ? "out" : "in");
}

async function send(text) {
  bubble(text, "out");
  $("input").value = "";
  $("send").disabled = true;
  typing(true);

  try {
    const res = await fetch("/simulator/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, from: phone }),
    });
    const data = await res.json();
    typing(false);

    if (!res.ok) {
      bubble(data.message || "Something went wrong.", "in");
      return;
    }
    bubble(data.reply, "in", data.elapsedMs ? `${(data.elapsedMs / 1000).toFixed(1)}s` : null);
  } catch (err) {
    typing(false);
    bubble(`Could not reach the server: ${err.message}`, "in");
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (text) send(text);
});

$("suggestions").addEventListener("click", (e) => {
  const q = e.target.dataset?.q;
  if (q) send(q);
});

$("guest").addEventListener("change", (e) => {
  phone = e.target.value;
  loadHistory();
});

loadGuests().catch((err) => {
  $("who").textContent = "offline";
  bubble(`Could not load guests: ${err.message}`, "in");
});
</script>
</body>
</html>
