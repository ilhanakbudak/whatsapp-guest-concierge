<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Villa Meltem · Simulator</title>
<link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230e7c6b'/><text x='16' y='23' font-size='18' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>V</text></svg>">
<link rel="stylesheet" href="/app.css">
<style>
  .sim { max-width: 760px; margin-inline: auto; padding: var(--sp-5); display: grid; gap: var(--sp-4); }

  .thread {
    container-type: inline-size;
    display: flex; flex-direction: column;
    height: clamp(420px, calc(100dvh - 210px), 760px);
    resize: vertical; overflow: hidden; /* operator can drag the chat taller */
  }

  .log {
    flex: 1 1 auto; overflow-y: auto;
    padding: var(--sp-5);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }

  .msg { display: grid; gap: var(--sp-1); max-width: min(78%, 480px); }
  .msg.out { justify-items: end; margin-inline-start: auto; }

  .bubble {
    padding: var(--sp-3) var(--sp-4);
    border-radius: var(--r-lg);
    font-size: var(--fs-md); line-height: var(--lh-base);
    white-space: pre-wrap; overflow-wrap: anywhere;
    animation: msg-in var(--dur-slow) var(--ease-out);
  }
  .msg.in .bubble {
    background: var(--surface-2); border: 1px solid var(--border);
    border-end-start-radius: var(--r-sm);
  }
  .msg.out .bubble {
    background: var(--accent); color: var(--accent-fg);
    border-end-end-radius: var(--r-sm);
  }
  .msg .meta { font-size: var(--fs-2xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }

  .typing { display: flex; gap: 4px; padding: var(--sp-4); align-self: flex-start; }
  .typing i {
    width: 6px; height: 6px; border-radius: var(--r-full);
    background: var(--text-3); animation: blink 1.1s infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.16s; }
  .typing i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.28; } 30% { opacity: 1; } }

  .chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; padding: 0 var(--sp-5) var(--sp-4); }
  .composer {
    display: flex; gap: var(--sp-2);
    padding: var(--sp-4) var(--sp-5);
    border-top: 1px solid var(--border);
  }
  .composer input { flex: 1 1 auto; }

  @container (max-width: 420px) {
    .log, .chips, .composer { padding-inline: var(--sp-4); }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>

<div class="sim">
  <div style="display:flex;align-items:center;gap:var(--sp-3)">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">V</div>
      <div class="brand-text"><strong>Simulator</strong><span>Talks to the real pipeline</span></div>
    </div>
    <div class="spacer"></div>
    <a class="btn sm" href="/dashboard">Dashboard</a>
  </div>

  <div class="notice small">
    Same allowlist, same model, same calendar as a real WhatsApp message.
    Only Twilio is left out.
  </div>

  <div class="panel thread">
    <header>
      <div class="brand-mark" aria-hidden="true" style="width:30px;height:30px">V</div>
      <div style="min-width:0">
        <div style="font-weight:590;font-size:var(--fs-md)">Villa Meltem Concierge</div>
        <div class="hint" id="who">connecting…</div>
      </div>
      <div class="spacer"></div>
      <div class="field" style="max-width:190px">
        <label class="visually-hidden" for="guest">Send as</label>
        <select id="guest"></select>
      </div>
    </header>

    <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation"></div>

    <div class="chips" id="chips">
      <button class="btn sm" data-q="What's the wifi password?">wifi password</button>
      <button class="btn sm" data-q="What time is the boat today?">boat time</button>
      <button class="btn sm" data-q="What's happening tomorrow?">tomorrow</button>
      <button class="btn sm" data-q="Where do we eat tonight and what's the dress code?">dinner &amp; dress code</button>
    </div>

    <form class="composer" id="composer">
      <label class="visually-hidden" for="input">Message</label>
      <input id="input" placeholder="Ask about the villa…" autocomplete="off" required>
      <button class="btn primary" type="submit" id="send">Send</button>
    </form>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script type="module" src="/simulator.js"></script>
</body>
</html>
