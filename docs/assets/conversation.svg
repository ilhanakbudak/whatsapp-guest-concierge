<svg xmlns="http://www.w3.org/2000/svg" width="880" height="606" viewBox="0 0 880 606" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A real conversation with the WhatsApp concierge bot">
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.16"/></filter></defs>
<rect width="880" height="606" rx="14" fill="#EFE7DE"/>
<rect x="236" y="0" width="628" height="606" fill="#ECE5DD"/>
<rect x="236" y="0" width="628" height="60" fill="#075E54"/>
<circle cx="266" cy="30" r="17" fill="#25D366"/>
<text x="266" y="36" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">V</text>
<text x="295" y="26" font-size="14.5" fill="#FFFFFF" font-weight="600">Villa Meltem Concierge</text>
<text x="295" y="44" font-size="11.5" fill="#B7D8D2">online</text>
<rect x="646" y="96" width="204" height="47" rx="9" fill="#D9FDD3" filter="url(#s)"/>
<text x="660" y="123" font-size="13.5" fill="#111B21">what&#x27;s the wifi password?</text>
<rect x="250" y="157" width="345" height="85" rx="9" fill="#FFFFFF" filter="url(#s)"/>
<text x="264" y="184" font-size="13.5" fill="#111B21">The Wi‑Fi password is turquoise-2026. Use</text>
<text x="264" y="203" font-size="13.5" fill="#111B21">VillaMeltem, or VillaMeltem-Pool on the lower</text>
<text x="264" y="222" font-size="13.5" fill="#111B21">terrace.</text>
<text x="218" y="175" font-size="11" fill="#7A8A94" text-anchor="end">answered from the</text>
<text x="218" y="190" font-size="11" fill="#7A8A94" text-anchor="end">knowledge base</text>
<text x="218" y="205" font-size="11" fill="#7A8A94" text-anchor="end">· no API calls</text>
<path d="M 224 171 L 242 171" stroke="#C3D0D6" stroke-width="1.4"/>
<circle cx="242" cy="171" r="2.4" fill="#C3D0D6"/>
<rect x="667" y="256" width="183" height="47" rx="9" fill="#D9FDD3" filter="url(#s)"/>
<text x="681" y="283" font-size="13.5" fill="#111B21">what time is the boat?</text>
<rect x="250" y="317" width="352" height="85" rx="9" fill="#FFFFFF" filter="url(#s)"/>
<text x="264" y="344" font-size="13.5" fill="#111B21">The boat trip is today from 14:00 to 18:00,</text>
<text x="264" y="363" font-size="13.5" fill="#111B21">departing promptly from the South Jetty. Bring</text>
<text x="264" y="382" font-size="13.5" fill="#111B21">swimwear, a towel and sun cream.</text>
<text x="218" y="335" font-size="11" fill="#7A8A94" text-anchor="end">get_schedule tool →</text>
<text x="218" y="350" font-size="11" fill="#7A8A94" text-anchor="end">live Google Calendar</text>
<text x="218" y="365" font-size="11" fill="#7A8A94" text-anchor="end">· read at answer time</text>
<path d="M 224 331 L 242 331" stroke="#C3D0D6" stroke-width="1.4"/>
<circle cx="242" cy="331" r="2.4" fill="#C3D0D6"/>
<rect x="667" y="416" width="183" height="47" rx="9" fill="#D9FDD3" filter="url(#s)"/>
<text x="681" y="443" font-size="13.5" fill="#111B21">how much does it cost?</text>
<rect x="250" y="477" width="387" height="85" rx="9" fill="#FFFFFF" filter="url(#s)"/>
<text x="264" y="504" font-size="13.5" fill="#111B21">I don’t have the boat trip price to hand. I can ask</text>
<text x="264" y="523" font-size="13.5" fill="#111B21">Sofia to confirm the current cost — how many guests</text>
<text x="264" y="542" font-size="13.5" fill="#111B21">should I ask for?</text>
<text x="218" y="495" font-size="11" fill="#7A8A94" text-anchor="end">not in the knowledge</text>
<text x="218" y="510" font-size="11" fill="#7A8A94" text-anchor="end">base, so it declines</text>
<text x="218" y="525" font-size="11" fill="#7A8A94" text-anchor="end">· no invented price</text>
<path d="M 224 491 L 242 491" stroke="#C3D0D6" stroke-width="1.4"/>
<circle cx="242" cy="491" r="2.4" fill="#C3D0D6"/>
<text x="236" y="596" font-size="10.5" fill="#98A6AE">Transcript from a live run · real Google Calendar · answers unedited</text>
</svg>